[PHP]
extension_dir = "ext"
date.timezone = "America/Argentina/Buenos_Aires"
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M

extension=curl
extension=fileinfo
extension=intl
extension=mbstring
extension=mysqli
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=zip

[Session]
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
