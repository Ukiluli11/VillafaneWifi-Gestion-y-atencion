[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.pruebas"
pythonpath = ["backend"]
testpaths = ["backend/tests", "backend/apps"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
