{# Campo uniforme con ayuda y mensajes de validación. #}
<div class="campo-formulario {% if campo.errors %}campo-error{% endif %}">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %}<span>*</span>{% endif %}</label>
    {{ campo }}
    {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
    {% for error in campo.errors %}<p class="error-formulario">{{ error }}</p>{% endfor %}
</div>
